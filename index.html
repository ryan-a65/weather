<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #eaf6ff;
        }
    </style>
</head>

<body>

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">Weather App</h3>

            <div class="input-group mb-3">
                <input type="text" id="city" class="form-control" placeholder="Enter city name...">
                <button class="ms-2 btn btn-primary" onclick="getWeather()">Check</button>
            </div>

            <div id="result" class="text-center mt-3"></div>
        </div>
    </div>

</body>
<script src="./main.js"></script>

</html>
